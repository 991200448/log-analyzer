                    rawSearchInput.value = d.traceId;
                    performSearch();
                }
            });
        });

        window.addEventListener('resize', function() {
            if (dashboardPanel.classList.contains('show')) {
                if (pieChartWrapper.style.display !== 'none') {
                    drawPieChart();
                } else if (trendChartWrapper.style.display !== 'none') {
                    drawTrendChart();
                } else {
                    drawErrorChart();
                }
            }
        });

        // ========== 时间趋势 ==========
        let timeTrendData = [];
        let trendHoveredIndex = -1;

        function buildTimeTrendData() {
            const buckets = {};
            allLogs.forEach(log => {
                if (log.level !== 'ERROR') return;
                const hour = log.time.substring(0, 13);
                if (!buckets[hour]) {
                    buckets[hour] = { hour, count: 0, errors: [] };
                }
                buckets[hour].count++;
                buckets[hour].errors.push({
                    className: log.className,
                    lineNum: log.lineNum,
                    message: log.message,
                    time: log.time,
                    traceId: log.traceId,
                    thread: log.thread
                });
            });

            timeTrendData = Object.values(buckets).sort((a, b) => a.hour.localeCompare(b.hour));
        }

        function drawTrendChart() {
            if (!trendChart || timeTrendData.length === 0) { buildTimeTrendData(); }
            if (timeTrendData.length === 0) return;

            const canvas = trendChart;
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            if (rect.width <= 0) return;

            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = '100%';
            canvas.style.height = '400px';
            const w = rect.width - 32;
            const h = 400;
            canvas.width = w * dpr;
            canvas.height = h * dpr;

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const bgColor = isDark ? '#0d0d1a' : '#f8f9fa';
            canvas.style.background = bgColor;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, w, h);

            const pad = { top: 20, right: 30, bottom: 60, left: 55 };
            const plotW = w - pad.left - pad.right;
            const plotH = h - pad.top - pad.bottom;
            const maxCount = Math.max(...timeTrendData.map(d => d.count), 1);
            const yMax = maxCount + Math.max(1, Math.ceil(maxCount * 0.15));
            const n = timeTrendData.length;

            // Y轴
            const isDarkTheme = isDark;
            ctx.fillStyle = isDarkTheme ? '#aaa' : '#666';
            ctx.font = '12px monospace';
            ctx.textAlign = 'right';
            const ySteps = 5;
            for (let i = 0; i <= ySteps; i++) {
                const val = Math.round((yMax / ySteps) * i);
                const y = pad.top + plotH - (plotH / ySteps) * i;
                ctx.fillText(val, pad.left - 8, y + 4);
                if (i > 0) {
                    ctx.strokeStyle = isDarkTheme ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
                    ctx.beginPath();
                    ctx.moveTo(pad.left, y);
                    ctx.lineTo(w - pad.right, y);
                    ctx.stroke();
                }
            }

            // 数据点
            const points = timeTrendData.map((d, i) => {
                const x = pad.left + (n > 1 ? (plotW / (n - 1)) * i : plotW / 2);
                const y = pad.top + plotH - (d.count / yMax) * plotH;
                return { x, y, index: i, data: d };
            });

            // X轴
            ctx.fillStyle = isDarkTheme ? '#aaa' : '#666';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            const labelStep = Math.max(1, Math.floor(n / 16));
            for (let i = 0; i < n; i += labelStep) {
                const label = timeTrendData[i].hour.substring(5, 13).replace(' ', '\\n');
                const parts = label.split('\\n');
                ctx.fillText(parts[0] || '', points[i].x, pad.top + plotH + 16);
                if (parts[1]) ctx.fillText(parts[1], points[i].x, pad.top + plotH + 30);
            }

            // 渐变填充
            const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
            grad.addColorStop(0, 'rgba(33,150,243,0.25)');
            grad.addColorStop(1, 'rgba(33,150,243,0.01)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(points[0].x, pad.top + plotH);
            points.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(points[points.length - 1].x, pad.top + plotH);
            ctx.closePath();
            ctx.fill();

            // 连线
            if (n > 1) {
                ctx.strokeStyle = '#2196f3';
                ctx.lineWidth = 2;
                ctx.beginPath();
                points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                ctx.stroke();
            }

            // 数据点
            points.forEach((p, i) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, i === trendHoveredIndex ? 7 : 4.5, 0, Math.PI * 2);
                ctx.fillStyle = i === trendHoveredIndex ? '#ff9800' : '#2196f3';
                ctx.fill();
                ctx.strokeStyle = bgColor;
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            canvas._trendPoints = points;
            canvas._trendW = w;
        }

        trendChart.addEventListener('mousemove', function(e) {
            if (!trendChart._trendPoints) return;
            const rect = trendChart.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const points = trendChart._trendPoints;

            let nearest = -1;
            let minDist = Infinity;
            for (let i = 0; i < points.length; i++) {
                const dx = mx - points[i].x;
                const dy = my - points[i].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist && dist < 20) { minDist = dist; nearest = i; }
            }

            if (nearest !== trendHoveredIndex) {
                trendHoveredIndex = nearest;
                drawTrendChart();
            }

            if (nearest >= 0) {
                const d = timeTrendData[nearest];
                chartTooltip.innerHTML = `
                    <div class="tt-label"><span class="tt-count">${d.count}</span> 次 ERROR</div>
                    <div class="tt-time">${d.hour}:00 ~ ${d.hour}:59</div>
                    <div style="color:#aaa;margin-top:4px;">共 ${d.errors.length} 种错误类型</div>
                    <div style="color:#2196f3;margin-top:6px;font-size:11px;">点击查看该时段解析结果</div>
                `;
                chartTooltip.style.display = 'block';
                chartTooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 440) + 'px';
                chartTooltip.style.top = Math.max(10, e.clientY - 10 - chartTooltip.offsetHeight) + 'px';
                trendChart.style.cursor = 'pointer';
            } else {
                chartTooltip.style.display = 'none';
                trendChart.style.cursor = 'default';
            }
        });

        trendChart.addEventListener('mouseleave', function() {
            trendHoveredIndex = -1;
            drawTrendChart();
            chartTooltip.style.display = 'none';
            trendChart.style.cursor = 'default';
        });

        trendChart.addEventListener('click', function() {
            if (trendHoveredIndex < 0) return;
            const d = timeTrendData[trendHoveredIndex];
            document.getElementById('startTime').value = d.hour.substring(0, 10) + 'T' + d.hour.substring(11, 13) + ':00';
            // 触发 ERROR 筛选按钮
            document.querySelector('.filter-btn[data-level="ERROR"]').click();
            // 切换到解析结果标签
            tabBar.querySelector('.tab-btn[data-tab="results"]').click();
        });

        // ========== 饼状图 ==========
        let pieHoveredIndex = -1;
        let pieHoveredLegend = -1;
        const PIE_COLORS = ['#2196f3', '#f44336', '#ff9800', '#4caf50', '#9c27b0', '#00bcd4',
            '#e91e63', '#3f51b5', '#ffeb3b', '#795548', '#607d8b', '#cddc39', '#ff5722', '#8bc34a',
            '#009688', '#673ab7', '#03a9f4', '#e040fb', '#7c4dff', '#00e676'];

        function drawPieChart() {
            if (!pieChart || errorChartData.length === 0) return;

            const canvas = pieChart;
            const container = canvas.parentElement;
            const rect = container.getBoundingClientRect();
            if (rect.width <= 0) return;

            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = '100%';
            canvas.style.height = '500px';
            const w = rect.width - 32;
            const h = 500;
            canvas.width = w * dpr;
            canvas.height = h * dpr;

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const bgColor = isDark ? '#0d0d1a' : '#f8f9fa';
            canvas.style.background = bgColor;
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, w, h);

            const cx = w / 2;
            const cy = 160;
            const radius = Math.min(cx, cy) - 40;
            const explode = 8;

            const total = errorChartData.reduce((s, d) => s + d.count, 0);
            let angles = [];
            let startAngle = -Math.PI / 2;

            errorChartData.forEach((d, i) => {
                const sliceAngle = (d.count / total) * Math.PI * 2;
                angles.push({ start: startAngle, end: startAngle + sliceAngle, index: i });
                startAngle += sliceAngle;
            });

            // 2D 饼状图
            angles.forEach((seg, i) => {
                const isHovered = i === pieHoveredIndex;
                const midAngle = (seg.start + seg.end) / 2;
                const ex = isHovered ? Math.cos(midAngle) * explode : 0;
                const ey = isHovered ? Math.sin(midAngle) * explode : 0;

                ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
                ctx.beginPath();
                ctx.moveTo(cx + ex, cy + ey);
                ctx.arc(cx + ex, cy + ey, radius, seg.start, seg.end);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = bgColor;
                ctx.lineWidth = isHovered ? 3 : 2;
                ctx.stroke();
            });

            // 中心空白圆（甜甜圈效果）
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.arc(cx, cy, radius * 0.35, 0, Math.PI * 2);
            ctx.fill();

            // 中心文字
            ctx.fillStyle = isDark ? '#fff' : '#333';
            ctx.font = 'bold 16px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`共 ${errorChartData.length} 类`, cx, cy - 6);
            ctx.font = '22px "Segoe UI", sans-serif';
            ctx.fillText(`${total} 次`, cx, cy + 20);

            // 图例
            const legendY = cy + radius + 20;
            const cols = Math.min(3, Math.ceil(errorChartData.length / 8));
            const colW = w / cols;
            let legendRects = [];
            ctx.font = '13px "Segoe UI", sans-serif';
            errorChartData.forEach((d, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const lx = 30 + col * colW;
                const ly = legendY + row * 26;
                const rx = lx - 4;
                const ry = ly - 10;
                const rw = colW - 12;
                const rh = 22;

                ctx.fillStyle = i === pieHoveredLegend ? 'rgba(255,255,255,0.1)' : 'transparent';
                if (i === pieHoveredLegend) {
                    ctx.fillRect(rx, ry, rw, rh);
                }

                ctx.fillStyle = PIE_COLORS[i % PIE_COLORS.length];
                ctx.fillRect(lx, ly - 5, 10, 10);

                ctx.fillStyle = i === pieHoveredLegend
                    ? (isDark ? '#fff' : '#0088cc')
                    : (isDark ? '#ddd' : '#333');
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                const short = d.className.split('.').pop();
                const pct = ((d.count / total) * 100).toFixed(1);
                ctx.fillText(`${short} (${d.count}次 ${pct}%)`, lx + 16, ly + 5);

                legendRects.push({ rx, ry, rw, rh, index: i });
            });

            canvas._pieAngles = angles;
            canvas._pieCx = cx;
            canvas._pieCy = cy;
            canvas._pieRadius = radius;
            canvas._pieW = w;
            canvas._legendRects = legendRects;
        }

        pieChart.addEventListener('mousemove', function(e) {
            if (!pieChart._pieAngles) return;
            const rect = pieChart.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            const cx = pieChart._pieCx;
            const cy = pieChart._pieCy;
            const radius = pieChart._pieRadius;

            // 先检查图例区域
            let legendIdx = -1;
            if (pieChart._legendRects) {
                for (let i = 0; i < pieChart._legendRects.length; i++) {
                    const r = pieChart._legendRects[i];
                    if (mx >= r.rx && mx <= r.rx + r.rw && my >= r.ry && my <= r.ry + r.rh) {
                        legendIdx = r.index;
                        break;
                    }
                }
            }

            if (legendIdx >= 0) {
                pieHoveredIndex = -1;
                if (legendIdx !== pieHoveredLegend) {
                    pieHoveredLegend = legendIdx;
                    drawPieChart();
                }
                const d = errorChartData[legendIdx];
                showPieTooltip(e, d);
                pieChart.style.cursor = 'pointer';
                return;
            }

            // 检查饼图区域
            const dx = mx - cx;
            const dy = my - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > radius) {
                if (pieHoveredIndex >= 0 || pieHoveredLegend >= 0) {
                    pieHoveredIndex = -1;
                    pieHoveredLegend = -1;
                    drawPieChart();
                }
                chartTooltip.style.display = 'none';
                pieChart.style.cursor = 'default';
                return;
            }

            pieHoveredLegend = -1;
            let angle = Math.atan2(dy, dx);
            if (angle < -Math.PI / 2) angle += Math.PI * 2;

            let idx = -1;
            for (let i = 0; i < pieChart._pieAngles.length; i++) {
                const seg = pieChart._pieAngles[i];
                if (angle >= seg.start && angle < seg.end) { idx = i; break; }
            }

            if (idx !== pieHoveredIndex) {
                pieHoveredIndex = idx;
                drawPieChart();
            }

            if (idx >= 0) {
                showPieTooltip(e, errorChartData[idx]);
                pieChart.style.cursor = 'pointer';
            }
        });

        function showPieTooltip(e, d) {
            const parts = d.className.split('.');
            const shortClass = parts.length > 2 ? '..' + parts.slice(-2).join('.') : d.className;
            const pct = ((d.count / errorChartData.reduce((s, x) => s + x.count, 0)) * 100).toFixed(1);
            chartTooltip.innerHTML = `
                <div class="tt-label">ERROR 重复 <span class="tt-count">${d.count}</span> 次</div>
                <div style="color:#aaa;">占比: ${pct}%</div>
                <div class="tt-time">${d.timeRange}</div>
                <div>线程: ${d.thread}</div>
                <div style="color:#aaa;margin-top:4px;">${shortClass}[${d.lineNum}]</div>
                <div style="margin-top:2px;">${escapeHtml(d.message.length > 80 ? d.message.substring(0, 80) + '...' : d.message)}</div>
                <div style="color:#2196f3;margin-top:6px;font-size:11px;">点击跳转日志详情</div>
            `;
            chartTooltip.style.display = 'block';
            chartTooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 440) + 'px';
            chartTooltip.style.top = Math.max(10, e.clientY - 10 - chartTooltip.offsetHeight) + 'px';
        }

        pieChart.addEventListener('mouseleave', function() {
            pieHoveredIndex = -1;
            pieHoveredLegend = -1;
            drawPieChart();
            chartTooltip.style.display = 'none';
            pieChart.style.cursor = 'default';
        });

        function jumpToPieLog(d) {
            const file = fileInput.files[0];
            if (!file) return;
            const searchKeyword = `${d.className}[${d.lineNum}] - ${d.message}`;
            const logTime = d.times[0];
            if (logTime) {
                const dateMatch = logTime.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);
                if (dateMatch) {
                    document.getElementById('startTime').value = `${dateMatch[1]}T${dateMatch[2]}`;
                }
            }
            loadRawLog(file).then(() => {
                rawSearchInput.value = searchKeyword;
                performSearch();
                if (searchMatches.length === 0 && d.traceId) {
                    rawSearchInput.value = d.traceId;
                    performSearch();
                }
            });
        }

        pieChart.addEventListener('click', function(e) {
            const idx = pieHoveredLegend >= 0 ? pieHoveredLegend : pieHoveredIndex;
            if (idx < 0) return;
            jumpToPieLog(errorChartData[idx]);
        });

        // ========== TraceId 追踪 ==========
        let traceIdMap = {};

        function buildTraceIdMap() {
            traceIdMap = {};
            // 仅收集 traceId 非空的日志，直接按 traceId 分组
            allLogs.forEach(log => {
                const tid = log.traceId;
                if (!tid || tid === 'N/A') return;
                if (!traceIdMap[tid]) {
                    traceIdMap[tid] = [];
                }
                traceIdMap[tid].push(log);
            });
            Object.keys(traceIdMap).forEach(tid => {
                traceIdMap[tid].sort((a, b) => a.time.localeCompare(b.time));
            });
        }

        function buildTraceIdSelect() {
            if (Object.keys(traceIdMap).length === 0) buildTraceIdMap();
            const sortedIds = Object.keys(traceIdMap).sort((a, b) => traceIdMap[b].length - traceIdMap[a].length);
            traceCount.innerHTML = `共 ${sortedIds.length} 个 TraceId <span style="color:var(--text-accent);font-size:11px;margin-left:8px;">Ctrl + 点击跳转</span>`;
            traceIdInput.value = '';
            traceIdClearBtn.style.display = 'none';
            traceLogList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">请选择一个 TraceId 查看完整调用链</div>';
            renderTraceDropdown('');
        }

        let _lastTraceDropdownFilter = undefined;

        function renderTraceDropdown(filter) {
            // 避免重复渲染相同过滤条件
            if (filter === _lastTraceDropdownFilter && traceIdDropdown.style.display === 'block') return;
            _lastTraceDropdownFilter = filter;

            const sortedIds = Object.keys(traceIdMap).sort((a, b) => traceIdMap[b].length - traceIdMap[a].length);
            const filtered = filter ? sortedIds.filter(tid => tid.toUpperCase().includes(filter.toUpperCase())) : sortedIds;
            const maxShow = 50;
            const shown = filtered.slice(0, maxShow);
            if (shown.length === 0) {
                traceIdDropdown.innerHTML = '<div style="padding:8px 12px;color:var(--text-muted);font-size:13px;">无匹配结果</div>';
            } else {
                let html = '';
                shown.forEach(tid => {
                    const logs = traceIdMap[tid];
                    const errorCount = logs.filter(l => l.level === 'ERROR').length;
                    html += `<div class="trace-dropdown-item" data-tid="${escapeHtml(tid)}" style="padding:7px 14px;cursor:pointer;font-size:13px;font-family:monospace;border-bottom:1px solid var(--border-color);line-height:1.5;" onmouseenter="this.style.background='var(--bg-tertiary-hover)'" onmouseleave="this.style.background=''">${escapeHtml(tid)} <span style="color:var(--text-secondary);">(${logs.length}条${errorCount > 0 ? ' | ERROR:' + errorCount : ''})</span></div>`;
                });
                if (filtered.length > maxShow) {
                    html += `<div style="padding:6px 14px;color:var(--text-muted);font-size:12px;text-align:center;">... 还有 ${filtered.length - maxShow} 个，请输入关键字筛选</div>`;
                }
                traceIdDropdown.innerHTML = html;
                traceIdDropdown.querySelectorAll('.trace-dropdown-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const tid = this.dataset.tid;
                        traceIdInput.value = tid;
                        traceIdClearBtn.style.display = '';
                        traceIdDropdown.style.display = 'none';
                        _lastTraceDropdownFilter = undefined;
                        displayTraceLogs(tid);
                    });
                });
            }
            traceIdDropdown.style.display = 'block';
        }

        traceIdInput.addEventListener('input', function() {
            traceIdClearBtn.style.display = this.value ? '' : 'none';
            renderTraceDropdown(this.value);
        });

        traceIdClearBtn.addEventListener('click', function() {
            traceIdInput.value = '';
            traceIdClearBtn.style.display = 'none';
            _lastTraceDropdownFilter = undefined;
            traceLogList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">请选择一个 TraceId 查看完整调用链</div>';
            renderTraceDropdown('');
            traceIdInput.focus();
        });

        traceIdInput.addEventListener('focus', function() {
            if (Object.keys(traceIdMap).length === 0) buildTraceIdMap();
            renderTraceDropdown(this.value);
        });

        traceIdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                traceIdDropdown.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (!traceIdInput.contains(e.target) && !traceIdDropdown.contains(e.target) && e.target !== traceIdClearBtn) {
                traceIdDropdown.style.display = 'none';
            }
        });

        function displayTraceLogs(tid) {
            const matchedLines = [];
            rawLinesCache.forEach(line => {
                if (line.includes(tid)) {
                    matchedLines.push(line);
                }
            });

            if (matchedLines.length === 0) {
                traceLogList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">未找到该 TraceId 的日志</div>';
                return;
            }

            const timePattern = /\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/;
            const firstTime = (matchedLines[0].match(timePattern) || [''])[0];
            const lastTime = (matchedLines[matchedLines.length - 1].match(timePattern) || [''])[0];
            const errorCount = matchedLines.filter(l => l.includes(' ERROR ')).length;

            let html = `
                <div style="margin-bottom:12px;padding:8px 12px;background:var(--bg-tertiary);border-radius:6px;font-size:13px;">
                    <strong>${escapeHtml(tid)}</strong>
                    <span style="color:var(--text-secondary);margin-left:12px;">共 ${matchedLines.length} 条日志</span>
                    <span style="color:#f44336;margin-left:8px;">ERROR: ${errorCount}</span>
                    <span style="color:var(--text-secondary);margin-left:12px;">${firstTime} ~ ${lastTime}</span>
                </div>
            `;

            const levelColors = { ERROR: '#f44336', WARN: '#ff9800', INFO: '#4caf50', DEBUG: '#2196f3' };
            const logPattern = /^\[traceId:([^\]]*)\]\s+(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\[([^\]]+)\]\s+(DEBUG|INFO|ERROR|WARN)\s+(.+?)\[(\d+)\]\s+-\s+(.*)\r?$/;

            matchedLines.forEach((line, i) => {
                const match = line.match(logPattern);
                if (!match) {
                    html += `<div style="padding:0 8px;margin:0;font-family:monospace;font-size:12px;line-height:1.3;white-space:pre-wrap;word-break:break-all;">${escapeHtml(line)}</div>`;
                    return;
                }
                const level = match[4];
                const color = levelColors[level] || '#aaa';
                const keyword = escapeHtml(`${match[5].trim()}[${match[6]}] - ${match[7].trim()}`);
                html += `<div class="trace-log-row" data-keyword="${keyword}" data-time="${match[2]}" data-traceid="${escapeHtml(tid)}" style="padding:0 8px;border-left:3px solid ${color};margin:0;background:${i % 2 === 0 ? 'transparent' : 'var(--bg-tertiary)'};cursor:pointer;font-family:monospace;font-size:12px;line-height:1.3;white-space:pre-wrap;word-break:break-all;" onmouseenter="this.style.background='var(--bg-tertiary-hover)'" onmouseleave="this.style.background='${i % 2 === 0 ? 'transparent' : 'var(--bg-tertiary)'}'">${escapeHtml(line.trim())}</div>`;
            });

            traceLogList.innerHTML = html;
            traceLogList.scrollTop = 0;

            traceLogList.querySelectorAll('.trace-log-row').forEach(row => {
                row.addEventListener('click', function(e) {
                    if (!e.ctrlKey && !e.metaKey) return;
                    const file = fileInput.files[0];
                    if (!file) return;
                    const logTime = this.getAttribute('data-time');
                    const keyword = this.getAttribute('data-keyword');
                    const traceId = this.getAttribute('data-traceid');
                    if (logTime) {
                        const dm = logTime.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}:\d{2})/);
                        if (dm) document.getElementById('startTime').value = `${dm[1]}T${dm[2]}`;
                    }
                    loadRawLog(file).then(() => {
                        if (keyword) {
                            rawSearchInput.value = keyword;
                            performSearch();
                            if (searchMatches.length === 0 && traceId) {
                                rawSearchInput.value = traceId;
                                performSearch();
                            }
                        }
                    });
                });
            });
        }

        // ========== 线程耗时统计（复用 TraceId 追踪的 traceIdMap） ==========
        let threadStatsCache = [];

        function buildThreadStats() {
            if (allLogs.length === 0) {
                threadStatList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">暂无数据，请先解析日志文件</div>';
                return;
            }

            // 复用 TraceId 追踪已有的分组数据，确保数量一致
            buildTraceIdMap();

            // 基于 traceIdMap 计算统计数据并缓存
            threadStatsCache = Object.keys(traceIdMap).map(tid => {
                const logs = traceIdMap[tid];
                const firstLog = logs[0];
                const lastLog = logs[logs.length - 1];
                const firstTime = new Date(firstLog.time.replace(' ', 'T'));
                const lastTime = new Date(lastLog.time.replace(' ', 'T'));
                const durationMs = lastTime - firstTime;
                const errorCount = logs.filter(l => l.level === 'ERROR').length;
                const warnCount = logs.filter(l => l.level === 'WARN').length;
                const threads = [...new Set(logs.map(l => l.thread))];
                return {
                    traceId: tid,
                    count: logs.length,
                    firstTime: firstLog.time,
                    lastTime: lastLog.time,
                    durationMs: durationMs,
                    errorCount: errorCount,
                    warnCount: warnCount,
                    threads: threads
                };
            }).sort((a, b) => b.durationMs - a.durationMs);

            threadTraceIdInput.value = '';
            renderThreadStats('');
        }

        function renderThreadStats(filter) {
            let filtered = threadStatsCache;
            const hasSearch = !!filter;
            if (filter) {
                const f = filter.toUpperCase();
                filtered = threadStatsCache.filter(s => s.traceId.toUpperCase().includes(f));
            } else {
                // 默认过滤掉 0ms 的（搜索时不限制）
                filtered = threadStatsCache.filter(s => s.durationMs > 0);
            }

            threadCount.innerHTML = filter
                ? `匹配 ${filtered.length} / ${threadStatsCache.length} 个 TraceId <span style="color:var(--text-accent);font-size:11px;margin-left:8px;">按总耗时降序排列</span>`
                : `共 ${filtered.length} 个 TraceId（已隐藏 0ms）<span style="color:var(--text-accent);font-size:11px;margin-left:8px;">按总耗时降序排列</span>`;

            if (filtered.length === 0) {
                threadStatList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">无匹配结果</div>';
                return;
            }

            const maxDuration = Math.max(...filtered.map(s => s.durationMs), 1);

            function formatDuration(ms) {
                if (ms < 1000) return ms + 'ms';
                if (ms < 60000) return (ms / 1000).toFixed(2) + 's';
                const m = Math.floor(ms / 60000);
                const s = ((ms % 60000) / 1000).toFixed(1);
                return m + 'm ' + s + 's';
            }

            let html = `
                <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:var(--bg-tertiary);position:sticky;top:0;z-index:1;">
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">#</th>
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">TraceId</th>
                        <th style="padding:8px 12px;text-align:right;font-size:12px;border-bottom:2px solid var(--border-color);">日志条数</th>
                        <th style="padding:8px 12px;text-align:right;font-size:12px;border-bottom:2px solid var(--border-color);">ERROR</th>
                        <th style="padding:8px 12px;text-align:right;font-size:12px;border-bottom:2px solid var(--border-color);">WARN</th>
                        <th style="padding:8px 12px;text-align:right;font-size:12px;border-bottom:2px solid var(--border-color);">总耗时</th>
                        <th style="padding:8px 12px;text-align:center;font-size:12px;border-bottom:2px solid var(--border-color);">耗时比例</th>
                    </tr>
                </thead>
                <tbody>`;

            filtered.forEach((s, i) => {
                const barWidth = Math.max((s.durationMs / maxDuration) * 100, 0.5);
                const barColor = s.durationMs > 60000 ? '#f44336' : s.durationMs > 10000 ? '#ff9800' : '#4caf50';
                html += `
                    <tr style="border-bottom:1px solid var(--border-color);${i % 2 === 0 ? '' : 'background:var(--bg-tertiary)'};" onmouseenter="this.style.background='var(--bg-tertiary-hover)'" onmouseleave="this.style.background='${i % 2 === 0 ? 'transparent' : 'var(--bg-tertiary)'}'">
                        <td style="padding:6px 12px;color:var(--text-muted);">${i + 1}</td>
                        <td style="padding:6px 12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:monospace;" title="${escapeHtml(s.traceId)}">${escapeHtml(s.traceId)}</td>
                        <td style="padding:6px 12px;text-align:right;color:var(--text-secondary);">${s.count}</td>
                        <td style="padding:6px 12px;text-align:right;color:${s.errorCount > 0 ? '#f44336' : 'var(--text-muted)'};">${s.errorCount}</td>
                        <td style="padding:6px 12px;text-align:right;color:${s.warnCount > 0 ? '#ff9800' : 'var(--text-muted)'};">${s.warnCount}</td>
                        <td style="padding:6px 12px;text-align:right;font-weight:bold;color:${barColor};">${formatDuration(s.durationMs)}</td>
                        <td style="padding:6px 12px;">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <div style="flex:1;height:8px;background:var(--bg-tertiary);border-radius:4px;overflow:hidden;">
                                    <div style="height:100%;width:${barWidth}%;background:${barColor};border-radius:4px;"></div>
                                </div>
                                <span style="font-size:10px;color:var(--text-muted);min-width:42px;text-align:right;">${(s.durationMs / maxDuration * 100).toFixed(1)}%</span>
                            </div>
                        </td>
                    </tr>
                    <tr style="border-bottom:1px solid var(--border-color);${i % 2 === 0 ? '' : 'background:var(--bg-tertiary)'};">
                        <td colspan="7" style="padding:2px 12px 6px 12px;font-size:11px;color:var(--text-muted);">
                            <span>${s.firstTime}</span>
                            <span style="margin:0 8px;">→</span>
                            <span>${s.lastTime}</span>
                            <span style="margin-left:12px;">线程: ${s.threads.join(', ')}</span>
                        </td>
                    </tr>`;
            });

            html += '</tbody></table>';
            threadStatList.innerHTML = html;
            threadStatList.scrollTop = 0;
        }

        // 输入过滤事件
        threadTraceIdInput.addEventListener('input', function() {
            threadTraceIdClearBtn.style.display = this.value ? '' : 'none';
            renderThreadStats(this.value);
            renderThreadDropdown(this.value);
        });

        threadTraceIdClearBtn.addEventListener('click', function() {
            threadTraceIdInput.value = '';
            threadTraceIdClearBtn.style.display = 'none';
            _lastThreadDropdownFilter = undefined;
            renderThreadStats('');
            renderThreadDropdown('');
            threadTraceIdInput.focus();
        });

        threadTraceIdInput.addEventListener('focus', function() {
            renderThreadDropdown(this.value);
        });

        threadTraceIdInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                threadTraceIdDropdown.style.display = 'none';
            }
        });

        document.addEventListener('click', function(e) {
            if (!threadTraceIdInput.contains(e.target) && !threadTraceIdDropdown.contains(e.target) && e.target !== threadTraceIdClearBtn) {
                threadTraceIdDropdown.style.display = 'none';
            }
        });

        let _lastThreadDropdownFilter = undefined;

        function renderThreadDropdown(filter) {
            if (filter === _lastThreadDropdownFilter && threadTraceIdDropdown.style.display === 'block') return;
            _lastThreadDropdownFilter = filter;

            const f = (filter || '').toUpperCase();
            const matches = f ? threadStatsCache.filter(s => s.traceId.toUpperCase().includes(f)) : threadStatsCache;
            const top10 = matches.slice(0, 10);
            if (top10.length === 0) {
                threadTraceIdDropdown.innerHTML = '<div style="padding:8px 12px;color:var(--text-muted);font-size:13px;">无匹配结果</div>';
            } else {
                let html = '';
                top10.forEach(s => {
                    html += `<div class="thread-dropdown-item" data-tid="${escapeHtml(s.traceId)}" style="padding:7px 14px;cursor:pointer;font-size:13px;font-family:monospace;border-bottom:1px solid var(--border-color);line-height:1.5;" onmouseenter="this.style.background='var(--bg-tertiary-hover)'" onmouseleave="this.style.background=''">${escapeHtml(s.traceId)} <span style="color:var(--text-secondary);">(${s.count}条 | ${formatDurationMs(s.durationMs)})</span></div>`;
                });
                if (matches.length > 10) {
                    html += `<div style="padding:6px 14px;color:var(--text-muted);font-size:12px;text-align:center;">... 还有 ${matches.length - 10} 个，请输入关键字筛选</div>`;
                }
                threadTraceIdDropdown.innerHTML = html;
                threadTraceIdDropdown.querySelectorAll('.thread-dropdown-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const tid = this.dataset.tid;
                        threadTraceIdInput.value = tid;
                        threadTraceIdClearBtn.style.display = '';
                        threadTraceIdDropdown.style.display = 'none';
                        _lastThreadDropdownFilter = undefined;
                        renderThreadStats(tid);
                    });
                });
            }
            threadTraceIdDropdown.style.display = 'block';
        }

        function formatDurationMs(ms) {
            if (ms < 1000) return ms + 'ms';
            if (ms < 60000) return (ms / 1000).toFixed(2) + 's';
            const m = Math.floor(ms / 60000);
            const s = ((ms % 60000) / 1000).toFixed(1);
            return m + 'm ' + s + 's';
        }

        // ========== 异常堆栈聚合（以 [traceId 为界，按 TraceId 分组展示） ==========
        function buildExceptionStats() {
            if (rawLinesCache.length === 0) {
                exceptionList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">暂无数据，请先解析日志文件</div>';
                return;
            }

            const logPattern = /^\[traceId:([^\]]*)\]\s+(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+\[([^\]]+)\]\s+(DEBUG|INFO|ERROR|WARN)\s+(.+?)\[(\d+)\]\s+-\s+(.*)\r?$/;
            const stackKeywordPattern = /(?:^\s+at\s|[a-z]+(?:\.[a-z]+)+[\w.$]*(?:Exception|Error)[:\s]|Caused\s+by:|\.\.\.\s+\d+\s+(?:more|common frames omitted))/i;
            const lines = rawLinesCache.map(l => l.replace(/\r/g, ''));

            // 第一遍：找到所有匹配日志格式的行索引
            const logIndices = [];
            for (let i = 0; i < lines.length; i++) {
                if (logPattern.test(lines[i])) logIndices.push(i);
            }

            // 收集所有异常块
            const blocks = [];
            for (let idx = 0; idx < logIndices.length; idx++) {
                const blockStart = logIndices[idx];
                const blockEnd = idx + 1 < logIndices.length ? logIndices[idx + 1] : lines.length;
                const firstLine = lines[blockStart];

                let hasStack = false;
                for (let j = blockStart + 1; j < blockEnd; j++) {
                    if (stackKeywordPattern.test(lines[j])) { hasStack = true; break; }
                }
                if (!hasStack) continue;

                const match = firstLine.match(logPattern);
                const tid = match[1].trim() || 'N/A';

                let exType = 'Unknown';
                for (let j = blockStart + 1; j < blockEnd; j++) {
                    const sl = lines[j].trim();
                    const exMatch = sl.match(/^(?:Caused\s+by:\s*)?([a-z]+(?:\.[a-z]+)+[\w.$]*(?:Exception|Error))/i);
                    if (exMatch) { exType = exMatch[1]; break; }
                }

                const blockLines = lines.slice(blockStart, blockEnd);
                const fullBlock = blockLines.map(l => l.trimEnd()).join('\n');

                blocks.push({
                    traceId: tid,
                    exType: exType,
                    time: match[2],
                    exampleLine: firstLine.trim(),
                    fullBlock: fullBlock
                });
            }

            // 按 TraceId 分组（同一 TraceId 可能有多个异常块）
            const tidMap = {};
            blocks.forEach(b => {
                if (!tidMap[b.traceId]) {
                    tidMap[b.traceId] = { traceId: b.traceId, exType: b.exType, firstTime: b.time, lastTime: b.time, count: 0, exampleLine: b.exampleLine, fullBlock: b.fullBlock };
                }
                tidMap[b.traceId].count++;
                tidMap[b.traceId].lastTime = b.time;
            });

            const stats = Object.values(tidMap);
            stats.sort((a, b) => b.firstTime.localeCompare(a.firstTime));

            exceptionCount.innerHTML = `共 ${stats.length} 个异常 TraceId`;

            if (stats.length === 0) {
                exceptionList.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:40px;">未检测到异常堆栈</div>';
                return;
            }

            let html = `
                <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:var(--bg-modal);position:sticky;top:0;z-index:2;">
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">#</th>
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">TraceId</th>
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">异常类型</th>
                        <th style="padding:8px 12px;text-align:right;font-size:12px;border-bottom:2px solid var(--border-color);">次数</th>
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">时间</th>
                        <th style="padding:8px 12px;text-align:left;font-size:12px;border-bottom:2px solid var(--border-color);">日志摘要</th>
                    </tr>
                </thead>
                <tbody>`;

            stats.forEach((s, idx) => {
                const shortName = s.exType.split('.').pop();
                const timeDisplay = s.count === 1 ? s.firstTime : `${s.firstTime} ~ ${s.lastTime}`;
                html += `
                    <tr style="border-bottom:1px solid var(--border-color);cursor:pointer;${idx % 2 === 0 ? '' : 'background:var(--bg-tertiary)'};" onmouseenter="this.style.background='var(--bg-tertiary-hover)'" onmouseleave="this.style.background='${idx % 2 === 0 ? 'transparent' : 'var(--bg-tertiary)'}'" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
                        <td style="padding:6px 12px;color:var(--text-muted);">${idx + 1}</td>
                        <td style="padding:6px 12px;font-family:monospace;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escapeHtml(s.traceId)}">${escapeHtml(s.traceId)}</td>
                        <td style="padding:6px 12px;color:#f44336;font-weight:bold;" title="${escapeHtml(s.exType)}">${escapeHtml(shortName)}</td>
                        <td style="padding:6px 12px;text-align:right;">${s.count}</td>
                        <td style="padding:6px 12px;color:var(--text-secondary);font-size:11px;">${timeDisplay}</td>
                        <td style="padding:6px 12px;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;" title="${escapeHtml(s.exampleLine)}">${escapeHtml(s.exampleLine)}</td>
                    </tr>
                    <tr style="display:none;border-bottom:1px solid var(--border-color);${idx % 2 === 0 ? '' : 'background:var(--bg-tertiary)'};">
                        <td colspan="6" style="padding:8px 12px;font-size:12px;">
                            <pre style="white-space:pre-wrap;word-break:break-all;margin:0;padding:10px;background:var(--bg-tertiary);border-radius:4px;max-height:400px;overflow-y:auto;color:var(--text);">${escapeHtml(s.fullBlock)}</pre>
                        </td>
                    </tr>`;
            });

            html += '</tbody></table>';
            exceptionList.innerHTML = html;
            exceptionList.scrollTop = 0;
        }
    </script>
</body>
</html>
